name: Deploy GitHub Pages artifact
description: Retry once if Pages cannot deploy the newly uploaded artifact
outputs:
  page_url:
    description: URL returned by the successful Pages deployment
    value: ${{ steps.retry.outputs.page_url || steps.publish.outputs.page_url }}
runs:
  using: composite
  steps:
    - id: publish
      continue-on-error: true
      uses: actions/deploy-pages@v5
    - name: Wait for uploaded artifact metadata
      if: steps.publish.outcome == 'failure'
      shell: bash
      run: sleep 12
    - name: Retry Pages deployment
      if: steps.publish.outcome == 'failure'
      id: retry
      uses: actions/deploy-pages@v5
