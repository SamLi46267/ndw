name: Collect GDACS events

on:
  push:
    branches: [main]
    paths:
      - 'backend/collect-gdacs.mjs'
      - 'backend/parse-gdacs-feed.py'
      - 'js/gdacs-status.js'
      - '.github/workflows/collect-gdacs.yml'
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

jobs:
  collect:
    if: github.event_name != 'issues' || github.event.issue.title == '[Data update] Refresh global hazards'
    concurrency:
      group: pages
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check recent global collections
        id: freshness
        if: github.event_name == 'issues'
        run: |
          node --input-type=module - <<'JS' >> "$GITHUB_OUTPUT"
          import { readFileSync } from 'node:fs';
          for (const [key, file, field] of [
            ['gdacs', 'gdacs-events.json', 'checkedAt'],
            ['quakes', 'global-earthquakes.json', 'fetchedAt']
          ]) {
            const snapshot = JSON.parse(readFileSync('public-data/' + file, 'utf8'));
            const age = Date.now() - Date.parse(snapshot[field]);
            console.log(key + '=' + (!(age >= 0 && age < 5 * 60000)));
          }
          JS
      - name: Collect GDACS snapshot
        if: github.event_name != 'issues' || steps.freshness.outputs.gdacs == 'true'
        run: node backend/collect-gdacs.mjs
      - name: Collect USGS earthquake snapshot
        if: github.event_name == 'push' || steps.freshness.outputs.quakes == 'true'
        run: node backend/collect-global.mjs
      - name: Publish snapshot
        run: |
          git add public-data/gdacs-events.json public-data/gdacs-disaster-history.json \
            public-data/global-earthquakes.json public-data/global-quakes-history.json
          if [ -f public-data/gdacs-history.json ]; then git add public-data/gdacs-history.json; fi
          if git diff --cached --quiet; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Publish GDACS snapshot [skip ci]"
          git pull --rebase origin main
          git push
      - name: Recover overdue China warnings during scheduled publication
        if: github.event_name == 'schedule'
        continue-on-error: true
        uses: ./.github/actions/recover-china
        with:
          weathercn-key: ${{ secrets.WEATHERCN_API_KEY }}
      - uses: ./.github/actions/publish-pages
      - name: Complete global data request
        if: github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          UPDATE_ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue close "$UPDATE_ISSUE_NUMBER" --reason completed
