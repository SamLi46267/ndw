name: Collect global earthquakes

on:
  push:
    branches: [main]
    paths:
      - 'backend/collect-global.mjs'
      - '.github/workflows/collect-global.yml'
  schedule:
    - cron: '4-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Collect earthquake snapshot
        env:
          APIZERO_KEY: ${{ github.event_name != 'schedule' && secrets.APIZERO_KEY || '' }}
        run: node backend/collect-global.mjs
      - name: Publish snapshot
        run: |
          if git diff --quiet -- public-data/global-earthquakes.json public-data/global-quakes-history.json; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public-data/global-earthquakes.json public-data/global-quakes-history.json
          git commit -m "Publish global earthquake snapshot [skip ci]"
          git pull --rebase origin main
          git push
      - uses: ./.github/actions/publish-pages
